
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Email Assets - CLC</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f4f8;
            margin: 0;
            padding: 40px 20px;
            text-align: center;
        }

        h1 {
            color: #073B98;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        .card {
            padding: 30px;
            margin: 20px 0;
            border-radius: 12px;
        }

        .dark {
            background: #073B98;
        }

        .light {
            background: white;
            border: 1px solid #ddd;
        }

        img {
            max-width: 260px;
            height: auto;
        }
    </style>
</head>

<body>
    <div class="container">

        <h1>Recursos Gráficos CLC</h1>

        <div class="card dark">
            <img
                src="assets/logo-clc-blanco.png"
                alt="Logo blanco Clínica Las Condes"
            >
        </div>

        <div class="card light">
            <img
                src="assets/logo-clc-color.png"
                alt="Logo Clínica Las Condes"
            >
        </div>

    </div>
</body>
</html>
